[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-vault-assistant"
dynamic = ["version"]
description = "A local desktop assistant for searching and working with an Obsidian vault."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "rich>=13.7",
]

[project.scripts]
nemo = "nemo.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "nemo.version.APP_VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
config = ["config/settings.yaml"]
