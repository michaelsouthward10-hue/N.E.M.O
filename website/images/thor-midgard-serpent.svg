<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Thor fishes for the Midgard Serpent</title>
<desc id="desc">A mythic sea scene in deep forest green and aged gold: a small boat faces a vast serpent rising from the waves while Thor lifts his hammer.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#182520"/><stop offset=".56" stop-color="#4d5847"/><stop offset="1" stop-color="#a47742"/></linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#425348"/><stop offset="1" stop-color="#17251f"/></linearGradient>
  <linearGradient id="serpent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cdb773"/><stop offset=".5" stop-color="#7c805d"/><stop offset="1" stop-color="#303c31"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#f1d79b" stop-opacity=".9"/><stop offset="1" stop-color="#d49e53" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter>
  <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="7" r=".7" fill="#f6e8bd" opacity=".22"/><circle cx="13" cy="14" r=".6" fill="#f6e8bd" opacity=".12"/></pattern>
</defs>
